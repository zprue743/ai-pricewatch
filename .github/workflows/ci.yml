name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commit messages
        shell: bash
        run: |
          PATTERN='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title must follow Conventional Commits (e.g., 'feat: add model filter' or 'fix(catalog): update pricing'). Got: $PR_TITLE"
            exit 1
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          while IFS= read -r msg; do
            if [[ "$msg" =~ ^Merge\  ]]; then
              continue
            fi
            if [[ ! "$msg" =~ $PATTERN ]]; then
              echo "::error::Commit message must follow Conventional Commits: $msg"
              exit 1
            fi
          done < <(git log --format=%s "${BASE_SHA}..${HEAD_SHA}")

  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build AiPriceWatch.sln -c Release -m:1

      - name: Run unit tests
        run: dotnet run --project tests/AiPriceWatch.Tests -c Release --no-build
